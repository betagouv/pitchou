name: Setup
description: Setup pnpm, Node 24 and install project dependencies

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.0

    - name: Setup Node 24
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install project dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Generate SvelteKit types (per app)
      shell: bash
      run: pnpm --filter "./apps/*" exec svelte-kit sync
