packages:
  - "apps/*"
  - "libs/*"
  - "scripts"
# Lifecycle build scripts stay disabled by default (see .npmrc: ignore-scripts).
# The app has always run with these skipped; keep them off unless a need arises.
allowBuilds:
  "@gouvfr/dsfr": false
  "@parcel/watcher": false
  "@sentry/cli": false
  esbuild: false

# Single source of truth for third-party dependency versions.
# Packages reference these with "catalog:" instead of repeating the range.
# peerDependencies keep their own (wider) ranges and are intentionally not catalog-ed.
catalog:
  "@aws-sdk/client-s3": "^3.1153.0"
  # Must resolve to the same release as client-s3, or the two disagree on @smithy/types.
  "@aws-sdk/s3-request-presigner": "3.1153.0"
  "@gouvfr/dsfr": "1.15.4"
  "@odfjs/odfjs": "github:odfjs/odfjs#v0.30.0"
  "@playwright/test": "^1.64.1"
  "@sentry/sveltekit": "^10.76.2"
  "@sveltejs/adapter-node": "^6.0.0"
  "@sveltejs/kit": "^3.1.0"
  "@sveltejs/vite-plugin-svelte": "^7.3.1"
  "@tailwindcss/vite": "^4.3.3"
  "@testing-library/jest-dom": "^7.0.1"
  "@testing-library/svelte": "^5.4.2"
  "@tiptap/core": "3.32.0"
  "@tiptap/extension-image": "3.32.0"
  "@tiptap/extension-table": "3.32.0"
  "@tiptap/extension-text-align": "3.32.0"
  "@tiptap/pm": "3.32.0"
  "@tiptap/starter-kit": "3.32.0"
  "@types/d3-dsv": "^3.0.7"
  "@types/node": "^24.19.2"
  "@types/sanitize-html": "^2.16.2"
  "@vitest/browser": "^5.0.5"
  "@vitest/browser-playwright": "^5.0.5"
  "csv-parse": "^7.0.3"
  "d3-dsv": "^3.0.1"
  "date-fns": "^4.4.0"
  "jose": "^6.2.12"
  "json-schema-to-typescript": "^16.0.0"
  "kanel": "^4.0.4"
  "knex": "^3.3.0"
  "ky": "^2.2.0"
  "maplibre-gl": "^6.15.0"
  "oxfmt": "^0.74.0"
  "oxlint": "^1.89.0"
  "p-limit": "^7.3.3"
  "pg": "^8.23.1"
  "rust-just": "^1.59.0"
  "sanitize-html": "^2.18.1"
  "sass": "^1.105.2"
  "svelte": "^5.57.2"
  "svelte-check": "^4.7.7"
  "tailwindcss": "^4.3.3"
  "tsx": "^4.23.15"
  "typescript": "^6.0.3"
  "vite": "^8.3.4"
  "vitest": "^5.0.5"
  "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"
