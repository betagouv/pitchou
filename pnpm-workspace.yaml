packages:
  - "apps/*"
  - "libs/*"
  - "scripts"
# Lifecycle build scripts stay disabled by default (see .npmrc: ignore-scripts).
# The app has always run with these skipped; keep them off unless a need arises.
allowBuilds:
  "@gouvfr/dsfr": false
  "@parcel/watcher": false
  "@sentry/cli": false
  esbuild: false

# Single source of truth for third-party dependency versions.
# Packages reference these with "catalog:" instead of repeating the range.
# peerDependencies keep their own (wider) ranges and are intentionally not catalog-ed.
catalog:
  "@aws-sdk/client-s3": "^3.1054.0"
  "@gouvfr/dsfr": "1.15.0"
  "@odfjs/odfjs": "github:odfjs/odfjs#v0.30.0"
